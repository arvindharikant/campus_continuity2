    <script>
      (function () {
        // 1. Suppress third-party Chrome extension script errors from triggering app error boundary
        window.addEventListener(
          'error',
          function (event) {
            if (
              (event && event.filename && String(event.filename).indexOf('chrome-extension://') === 0) ||
              (event && event.message && String(event.message).indexOf('Cannot set property fetch') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        // 2. Preserve native window.fetch so third-party extensions cannot throw getter-only
        //    TypeErrors OR hijack/stall Firebase/Firestore network requests
        var nativeDefineProperty = Object.defineProperty;
        var nativeFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;

        function protectFetchProperty(target) {
          if (!target || !nativeFetch) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && desc.configurable !== false) {
              nativeDefineProperty.call(Object, target, 'fetch', {
                configurable: true,
                enumerable: desc.enumerable !== false,
                get: function () {
                  return nativeFetch;
                },
                set: function () {
                  // Safe no-op: prevents extension TypeError and blocks fetch hijacking
                },
              });
            }
          } catch (_err) {}
        }

        protectFetchProperty(window);
        if (typeof Window !== 'undefined' && Window.prototype) {
          protectFetchProperty(Window.prototype);
        }

        // 3. Guard future Object.defineProperty(window, 'fetch', ...) calls from extensions
        try {
          Object.defineProperty = function (obj, prop, descriptor) {
            if (
              prop === 'fetch' &&
              nativeFetch &&
              (obj === window || (typeof Window !== 'undefined' && obj === Window.prototype))
            ) {
              return obj;
            }
            return nativeDefineProperty.call(Object, obj, prop, descriptor);
          };
        } catch (_err) {}
      })();
    </script>
